name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # Exact versions with hashes, wheels only: no unpinned package and no setup script runs.
      - name: Install dependencies
        run: pip install --require-hashes --only-binary :all: -r requirements-dev.lock
